<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>今日数学晨练</title>
<style>
:root{--text:#253238;--muted:#72808a;--orange:#ff7a59;--orange2:#f4511e;--green:#27a79a;--green2:#087f73;--line:#e9e2d8;--shadow:0 16px 40px rgba(83,62,31,.12)}*{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;color:var(--text);background:linear-gradient(145deg,#fffaf1,#f5fbfa)}button{font:inherit;cursor:pointer;border:0}.app{width:min(980px,calc(100% - 26px));margin:auto;padding:22px 0 40px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.logo{width:54px;height:54px;border-radius:18px;background:#ffd866;display:grid;place-items:center;font-size:29px}.sub{color:var(--muted);font-size:14px;margin:5px 0 0}.timer{min-width:128px;background:#263238;color:white;padding:10px 16px;border-radius:18px;text-align:center}.timer small{display:block;opacity:.72}.timer strong{font-size:26px}.timer.warn{background:#9a3412}.timer.done{background:var(--green2)}.card{background:#fff;border-radius:28px;padding:clamp(21px,4vw,36px);box-shadow:var(--shadow)}.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:24px}.hero h2{font-size:clamp(30px,5vw,48px);margin:0 0 12px}.hero p{color:var(--muted);line-height:1.8}.plan{display:grid;gap:8px}.plan-item{display:flex;justify-content:space-between;background:#f7f5ef;padding:11px 14px;border-radius:15px}.start{width:100%;margin-top:24px;padding:17px;border-radius:17px;color:#fff;background:linear-gradient(135deg,var(--orange),var(--orange2));font-weight:900;font-size:19px}.note{margin-top:15px;padding:13px 15px;border-radius:15px;background:#edf9f7;color:#376a64}.home-link{display:inline-block;margin-top:14px;color:var(--green2);font-weight:800;text-decoration:none}.hidden{display:none!important}.quiz-head{display:grid;grid-template-columns:1fr auto;gap:15px;align-items:center}.progress-label{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}.track{height:11px;background:#eee8df;border-radius:999px;overflow:hidden;margin-top:7px}.bar{height:100%;background:linear-gradient(90deg,var(--green),#72c88b);width:0}.badge{padding:9px 12px;border-radius:13px;background:#e9f8f5;color:var(--green2);font-weight:900}.category{text-align:center;color:#5b7cfa;font-weight:900;margin:24px 0 2px}.question{text-align:center;font-weight:950;font-size:clamp(40px,8vw,74px);margin:8px 0 25px}.question.logic{font-size:clamp(25px,5vw,42px);line-height:1.5}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.option{min-height:70px;border:2px solid var(--line);border-radius:18px;background:#fff;padding:14px;font-size:24px;font-weight:900}.option.selected{border-color:var(--green);background:#effbf9}.status{min-height:25px;text-align:center;margin-top:13px;color:var(--muted)}.controls{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:10px;margin-top:18px}.ctrl{padding:13px;border-radius:14px;background:#f2eee7;font-weight:850}.ctrl.primary{background:linear-gradient(135deg,var(--green),var(--green2));color:#fff}.pause-row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.tiny{padding:8px 10px;border-radius:11px;background:#eef7f5;color:var(--green2);font-weight:800}.score-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.score{background:#f7f5ef;border-radius:18px;padding:18px;text-align:center}.score strong{display:block;font-size:35px}.breakdown,.wrong{display:grid;gap:9px}.break-row{display:grid;grid-template-columns:1fr auto;padding:13px 14px;border-radius:14px;border:1px solid var(--line)}.wrong-item{padding:13px 15px;border-radius:14px;background:#fff5f4;border:1px solid #f2ceca;line-height:1.65}.actions{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:22px}.btn2{padding:15px;border-radius:15px;font-weight:900}.btn2.main{color:#fff;background:linear-gradient(135deg,var(--orange),var(--orange2))}.timeout{padding:13px 15px;border-radius:15px;background:#edf9f7;color:#376a64;margin-bottom:15px}.perfect{padding:20px;background:#effaf3;color:#27935c;text-align:center;border-radius:16px}@media(max-width:720px){.sub{display:none}.hero{grid-template-columns:1fr}.options{grid-template-columns:1fr}.controls{grid-template-columns:1fr 1fr}.controls .primary{grid-column:1/-1}.score-grid,.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div class="brand"><div class="logo">🌞</div><div><h1>今日数学晨练</h1><p class="sub">20分钟是目标时间，到点继续把题做完</p></div></div><div id="timerBox" class="timer"><small id="timerLabel">剩余时间</small><strong id="timer">20:00</strong></div></header>
<section id="setup" class="card"><div class="hero"><div><h2>60题，目标20分钟。</h2><p>时间到不会自动结束。做完整套再交卷。所有减法不出现负数；带余数除法的除数和商都在 9 以内，余数小于除数。</p></div><div class="plan"><div class="plan-item"><b>20以内减法</b><span>8题</span></div><div class="plan-item"><b>个位乘法</b><span>8题</span></div><div class="plan-item"><b>带余数除法</b><span>8题</span></div><div class="plan-item"><b>多位进位加法</b><span>8题</span></div><div class="plan-item"><b>多位借位减法</b><span>8题</span></div><div class="plan-item"><b>数学逻辑</b><span>20题</span></div></div></div><div id="wrongNote" class="note"></div><button id="startBtn" class="start" type="button">开始今日20分钟晨练</button><a class="home-link" href="./index.html">← 返回数学小工具首页</a></section>
<section id="quiz" class="card hidden"><div class="quiz-head"><div><div class="progress-label"><span id="progressText"></span><span id="sectionText"></span></div><div class="track"><div id="bar" class="bar"></div></div></div><div id="qNo" class="badge"></div></div><div id="category" class="category"></div><div id="question" class="question"></div><div id="options" class="options"></div><div id="status" class="status"></div><div class="controls"><button id="prevBtn" class="ctrl" type="button">上一题</button><button id="skipBtn" class="ctrl" type="button">先跳过</button><button id="submitBtn" class="ctrl primary" type="button">完成并交卷</button></div><div class="pause-row"><button id="pauseBtn" class="tiny" type="button">⏸ 暂停</button><button id="restartBtn" class="tiny" type="button">↻ 重新开始</button></div></section>
<section id="result" class="card hidden"><h2 id="resultTitle">晨练完成！</h2><div id="timeoutNote" class="timeout hidden">超过20分钟也没关系：今天已经把整套题完整做完了。</div><div class="score-grid"><div class="score"><strong id="score"></strong><span>得分</span></div><div class="score"><strong id="correct"></strong><span>答对</span></div><div class="score"><strong id="used"></strong><span>实际用时</span></div></div><h3>分项表现</h3><div id="breakdown" class="breakdown"></div><h3>今天的错题</h3><div id="wrongList" class="wrong"></div><div class="actions"><button id="againBtn" class="btn2" type="button">再来一组</button><button id="homeBtn" class="btn2 main" type="button">返回首页</button></div></section>
</main>
<script>
(()=>{
'use strict';
const TOTAL=60,LIMIT=1200,WRONG_KEY='childrenArithmeticMorningWrongV2',HISTORY_KEY='childrenArithmeticMorningHistoryV1';
const labels={sub20:'20以内减法',mul:'个位乘法',divRemain:'带余数除法',addCarry:'多位进位加法',subBorrow:'多位借位减法',logic:'数学逻辑',review:'错题复习'};
const $=id=>document.getElementById(id);
const els={setup:$('setup'),quiz:$('quiz'),result:$('result'),timer:$('timer'),timerLabel:$('timerLabel'),timerBox:$('timerBox'),start:$('startBtn'),wrongNote:$('wrongNote'),progressText:$('progressText'),sectionText:$('sectionText'),bar:$('bar'),qNo:$('qNo'),category:$('category'),question:$('question'),options:$('options'),status:$('status'),prev:$('prevBtn'),skip:$('skipBtn'),submit:$('submitBtn'),pause:$('pauseBtn'),restart:$('restartBtn'),score:$('score'),correct:$('correct'),used:$('used'),breakdown:$('breakdown'),wrongList:$('wrongList'),again:$('againBtn'),home:$('homeBtn'),timeoutNote:$('timeoutNote'),resultTitle:$('resultTitle')};
let state={questions:[],answers:[],index:0,elapsed:0,remain:LIMIT,timerId:null,paused:false,started:false,timedOut:false};
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}
const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
function numOptions(ans,spread=10){const s=new Set([ans]);while(s.size<4){const x=ans+rnd(-spread,spread);if(x>=0)s.add(x)}return shuffle([...s])}
const q=(type,text,answer,spread=10)=>({type,text,answer,options:numOptions(answer,spread)});
function sub20(){const a=rnd(11,20),b=rnd(2,Math.min(9,a));return q('sub20',`${a} − ${b} = ?`,a-b,5)}
function mul(){const a=rnd(2,9),b=rnd(2,9);return q('mul',`${a} × ${b} = ?`,a*b,12)}
function divRemain(){const divisor=rnd(2,9),quotient=rnd(1,9),remainder=rnd(1,divisor-1),dividend=divisor*quotient+remainder,answer=`${quotient}余${remainder}`;const s=new Set([answer]);while(s.size<4){const q2=Math.max(1,Math.min(9,quotient+rnd(-2,2))),r2=rnd(1,divisor-1);s.add(`${q2}余${r2}`)}return{type:'divRemain',text:`${dividend} ÷ ${divisor} = ?`,answer,options:shuffle([...s])}}
function hasCarry(a,b){while(a||b){if(a%10+b%10>=10)return true;a=Math.floor(a/10);b=Math.floor(b/10)}return false}
function carryAdd(){let a,b;do{a=rnd(10,999);b=rnd(10,999)}while(!hasCarry(a,b));return q('addCarry',`${a} + ${b} = ?`,a+b,25)}
function hasBorrow(a,b){while(a||b){if(a%10<b%10)return true;a=Math.floor(a/10);b=Math.floor(b/10)}return false}
function borrowSub(){let a,b;do{a=rnd(20,999);b=rnd(10,a-1)}while(!hasBorrow(a,b));return q('subBorrow',`${a} − ${b} = ?`,a-b,25)}
function logicQuestion(){const t=rnd(1,5);if(t===1){const s=rnd(1,8),d=rnd(2,5),seq=[0,1,2,3].map(i=>s+i*d);return q('logic',`${seq.join('，')}，下一个数是？`,s+4*d,8)}if(t===2){const a=rnd(2,9),b=rnd(2,9),sum=a+b,c=rnd(1,sum);return q('logic',`${a} + ${b} − ${c} = ?`,sum-c,6)}if(t===3){const total=rnd(10,25),part=rnd(2,total-2);return q('logic',`□ + ${part} = ${total}，□ 是多少？`,total-part,6)}if(t===4){const a=rnd(3,15),b=rnd(3,15),d=rnd(1,6),left=a+d,answer=left>b?1:left<b?2:3;return{type:'logic',text:`${a} + ${d} 和 ${b}，哪边更大？`,answer,options:[1,2,3,4],optionText:{1:'左边大',2:'右边大',3:'一样大',4:'不能判断'}}}const boxes=rnd(2,5),each=rnd(2,6),total=boxes*each,taken=rnd(1,total-2);return q('logic',`${boxes}盒，每盒${each}个，拿走${taken}个，还剩多少个？`,total-taken,8)}
function loadWrong(){try{const x=JSON.parse(localStorage.getItem(WRONG_KEY)||'[]');return Array.isArray(x)?x:[]}catch{return[]}}
function saveWrong(x){try{localStorage.setItem(WRONG_KEY,JSON.stringify(x.slice(0,80)))}catch{}}
function reviewQuestion(x){if(x.originalType==='divRemain'||x.type==='divRemain'){const m=String(x.answer).match(/^(\d+)余(\d+)$/);if(!m)return divRemain();const divisorMatch=String(x.text).match(/÷\s*(\d+)/);const divisor=divisorMatch?Number(divisorMatch[1]):9;const s=new Set([x.answer]);while(s.size<4){s.add(`${rnd(1,9)}余${rnd(1,Math.max(1,divisor-1))}`)}return{...x,type:'review',originalType:'divRemain',options:shuffle([...s])}}const ans=Number(x.answer);if(!Number.isFinite(ans)||ans<0)return logicQuestion();return{...x,type:'review',options:numOptions(ans,ans>100?25:10)}}
function build(){const a=[];for(let i=0;i<8;i++)a.push(sub20());for(let i=0;i<8;i++)a.push(mul());for(let i=0;i<8;i++)a.push(divRemain());for(let i=0;i<8;i++)a.push(carryAdd());for(let i=0;i<8;i++)a.push(borrowSub());for(let i=0;i<20;i++)a.push(logicQuestion());const w=shuffle(loadWrong()).slice(0,6);const idx=shuffle(Array.from({length:40},(_,i)=>i)).slice(0,w.length);idx.forEach((n,i)=>a[n]=reviewQuestion(w[i]));return a}
function show(x){[els.setup,els.quiz,els.result].forEach(e=>e.classList.add('hidden'));x.classList.remove('hidden')}
function tick(){els.timer.textContent=fmt(state.remain);els.timerBox.classList.toggle('warn',state.remain>0&&state.remain<=120);els.timerBox.classList.toggle('done',state.timedOut);els.timerLabel.textContent=state.timedOut?'目标时间已到':'剩余时间'}
function renderStatus(){els.status.textContent=state.paused?'已暂停':state.timedOut?'20分钟目标时间到了，继续把剩下的题做完。':'点击答案后会自动进入下一题'}
function display(q,x){return q.optionText?.[x]??x}
function render(){const x=state.questions[state.index],done=state.answers.filter(v=>v!==null).length;els.progressText.textContent=`已完成 ${done} / ${TOTAL}`;els.bar.style.width=`${done/TOTAL*100}%`;els.qNo.textContent=`第 ${state.index+1} 题`;els.sectionText.textContent=labels[x.type]||'错题复习';els.category.textContent=labels[x.type]||'错题复习';els.question.textContent=x.text;els.question.classList.toggle('logic',x.type==='logic'||x.type==='review');els.options.innerHTML='';x.options.forEach(v=>{const b=document.createElement('button');b.type='button';b.className='option'+(state.answers[state.index]===v?' selected':'');b.textContent=display(x,v);b.onclick=()=>choose(v);els.options.appendChild(b)});els.prev.disabled=state.index===0;renderStatus()}
function start(){clearInterval(state.timerId);state={questions:build(),answers:Array(TOTAL).fill(null),index:0,elapsed:0,remain:LIMIT,timerId:null,paused:false,started:true,timedOut:false};show(els.quiz);render();tick();state.timerId=setInterval(()=>{if(!state.paused&&state.started){state.elapsed++;state.remain=Math.max(0,LIMIT-state.elapsed);if(state.elapsed>=LIMIT)state.timedOut=true;tick();renderStatus()}},1000)}
function choose(v){if(state.paused)return;state.answers[state.index]=v;render();setTimeout(()=>{if(state.index<TOTAL-1){state.index++;render()}else finish()},120)}
function finish(){if(!state.started)return;const missing=state.answers.filter(v=>v===null).length;if(missing){state.index=state.answers.findIndex(v=>v===null);render();els.status.textContent=`还有 ${missing} 题没有完成，请继续做完。`;return}clearInterval(state.timerId);state.started=false;const correct=state.questions.reduce((n,q,i)=>n+(state.answers[i]===q.answer?1:0),0),score=Math.round(correct/TOTAL*100),wrong=[];state.questions.forEach((q,i)=>{if(state.answers[i]!==q.answer)wrong.push({...q,userAnswer:state.answers[i],originalType:q.originalType||q.type})});const solved=new Set(state.questions.filter((q,i)=>state.answers[i]===q.answer).map(q=>q.text));const old=loadWrong();const store=wrong.map(({text,answer,originalType,optionText})=>({text,answer,type:originalType,originalType,optionText}));saveWrong([...store,...old.filter(x=>!solved.has(x.text))]);try{const h=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');h.unshift({time:Date.now(),correct,score,used:state.elapsed,wrongCount:wrong.length});localStorage.setItem(HISTORY_KEY,JSON.stringify(h.slice(0,60)))}catch{}show(els.result);els.score.textContent=score;els.correct.textContent=`${correct} / ${TOTAL}`;els.used.textContent=fmt(state.elapsed);els.timeoutNote.classList.toggle('hidden',!state.timedOut);els.resultTitle.textContent=score>=90?'今天很稳！':score>=75?'晨练完成！':'今天找到了值得再练的地方';renderBreakdown();renderWrong(wrong)}
function renderBreakdown(){const types=['sub20','mul','divRemain','addCarry','subBorrow','logic','review'];els.breakdown.innerHTML=types.map(t=>{const idx=state.questions.map((q,i)=>q.type===t?i:-1).filter(i=>i>=0);if(!idx.length)return'';const c=idx.filter(i=>state.answers[i]===state.questions[i].answer).length;return `<div class="break-row"><b>${labels[t]}</b><span>${c} / ${idx.length}</span></div>`}).join('')}
function renderWrong(w){els.wrongList.innerHTML=w.length?w.map((x,i)=>`<div class="wrong-item"><b>第 ${i+1} 个错题</b><br>${x.text}<br>你的答案：${display(x,x.userAnswer)}　正确答案：<strong>${display(x,x.answer)}</strong></div>`).join(''):'<div class="perfect">🎉 今天60题全对！</div>'}
function updateNote(){const n=loadWrong().length;els.wrongNote.textContent=`所有减法不出现负数；带余数除法的除数和商不超过9，余数小于除数。${n?` 当前错题库 ${n} 题。`:''}`}
els.start.addEventListener('click',start);els.prev.addEventListener('click',()=>{if(state.index>0){state.index--;render()}});els.skip.addEventListener('click',()=>{if(state.index<TOTAL-1){state.index++;render()}else finish()});els.submit.addEventListener('click',finish);els.pause.addEventListener('click',()=>{state.paused=!state.paused;els.pause.textContent=state.paused?'▶ 继续':'⏸ 暂停';render()});els.restart.addEventListener('click',()=>{if(confirm('确定重新开始吗？'))start()});els.again.addEventListener('click',start);els.home.addEventListener('click',()=>location.href='./index.html');updateNote();tick();
})();
</script>
</body></html>
