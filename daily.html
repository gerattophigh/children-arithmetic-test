<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>每日测试</title><style>:root{--bg:#fff9f1;--card:#fff;--text:#263238;--muted:#6e7a80;--orange:#f97316;--orange2:#d95b0b;--green:#198d76;--line:#eadfd2;--red:#c2413b;--shadow:0 14px 34px rgba(80,57,31,.10)}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}.wrap{width:min(900px,calc(100% - 28px));margin:auto;padding:24px 0 48px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.back{text-decoration:none;color:var(--orange2);font-weight:850}.timer{background:#263238;color:#fff;border-radius:15px;padding:9px 13px;text-align:center;min-width:108px}.timer small{display:block;opacity:.7}.timer strong{font-size:22px}.timer.done{background:var(--green)}h1{margin:0 0 5px;font-size:clamp(29px,5vw,40px)}.muted{color:var(--muted);line-height:1.7}.card{background:#fff;border:1px solid var(--line);border-radius:26px;padding:clamp(20px,4vw,34px);box-shadow:var(--shadow)}.config{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.field{background:#fbf6ef;border-radius:15px;padding:12px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field select{width:100%;border:0;background:transparent;font-weight:850}.pool{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0}.tag{font-size:12px;padding:6px 9px;border-radius:999px;background:#f4efe8;color:#665e55;font-weight:750}.start{width:100%;border:0;border-radius:16px;padding:15px;background:linear-gradient(135deg,var(--orange),var(--orange2));color:#fff;font-weight:900;cursor:pointer}.hidden{display:none!important}.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}.progress{height:10px;background:#eee7df;border-radius:99px;overflow:hidden;margin:12px 0 24px}.bar{height:100%;background:var(--orange);width:0}.q{font-size:clamp(28px,6vw,48px);font-weight:900;text-align:center;line-height:1.45;margin:24px 0}.q.word{font-size:clamp(21px,4.5vw,34px)}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.opt{border:2px solid var(--line);background:#fff;border-radius:16px;padding:15px;font-size:20px;font-weight:850;cursor:pointer}.fill{display:flex;gap:10px}.fill input{flex:1;min-width:0;border:2px solid var(--line);border-radius:16px;padding:15px;font-size:22px;text-align:center}.fill button{border:0;border-radius:16px;padding:0 22px;background:var(--orange);color:#fff;font-weight:900}.feedback{text-align:center;min-height:28px;margin-top:13px;font-weight:850}.ok{color:var(--green)}.bad{color:var(--red)}.result{text-align:center}.result strong{font-size:54px;color:var(--orange)}.actions{display:flex;gap:10px;justify-content:center;margin-top:20px}.actions a,.actions button{border:0;border-radius:14px;padding:13px 18px;font-weight:850;text-decoration:none;cursor:pointer}.actions button{background:var(--orange);color:#fff}.actions a{background:#f0ece7;color:var(--text)}@media(max-width:700px){.config{grid-template-columns:1fr}.options{grid-template-columns:1fr}.top{align-items:flex-start}.fill{flex-direction:column}.fill button{padding:14px}}</style></head><body><main class="wrap"><div class="top"><div><h1>每日测试</h1><div class="muted">从专项训练题型池随机抽题。</div></div><div><div id="timerBox" class="timer"><small id="timerLabel">目标剩余</small><strong id="timer">20:00</strong></div><a class="back" href="./index.html">← 首页</a></div></div><section id="setup" class="card"><h2>今日测试设置</h2><p class="muted">20分钟只是速度目标，到 00:00 不会自动结束。题目必须全部做完后才显示结果。</p><div class="pool"><span class="tag">基础加减</span><span class="tag">多位加减</span><span class="tag">连加连减</span><span class="tag">个位乘多位</span><span class="tag">多位乘多位</span><span class="tag">除法余数</span><span class="tag">多位除法</span><span class="tag">应用题</span><span class="tag">运算律</span><span class="tag">小数/分数/百分数</span></div><div class="config"><div class="field"><label>总题数</label><select id="total"><option>20</option><option selected>30</option><option>40</option><option>60</option></select></div><div class="field"><label>选择题数量</label><select id="choice"><option>0</option><option>10</option><option selected>15</option><option>20</option><option>30</option></select></div><div class="field"><label>填空题数量</label><div id="fillCount" style="font-weight:900">15 题</div></div></div><button id="start" class="start">开始今日测试</button></section><section id="quiz" class="card hidden"><div class="meta"><span id="kind"></span><span id="count"></span></div><div class="progress"><div id="bar" class="bar"></div></div><div id="question" class="q"></div><div id="answerArea"></div><div id="feedback" class="feedback"></div></section><section id="result" class="card result hidden"><h2>今日测试完成</h2><p class="muted">错题已经自动进入「错题回顾」。</p><strong id="score">0%</strong><p id="scoreText"></p><p id="timeText" class="muted"></p><div class="actions"><button id="again">再测一次</button><a href="./wrong.html">查看错题</a><a href="./index.html">返回首页</a></div></section></main><script>(function(){'use strict';var WRONG='mathLearningWrongV3',LIMIT=1200;var types=['basic','multiAddSub','chain','oneMulti','multiMulti','remainder','longDiv','word','laws','fraction'];var labels={basic:'基础加减法',multiAddSub:'多位加减法',chain:'连加连减',oneMulti:'个位乘多位',multiMulti:'多位乘多位',remainder:'除法余数',longDiv:'多位除法',word:'应用题',laws:'运算律',fraction:'小数/分数/百分数'};var questions=[],index=0,correct=0,elapsed=0,timerId=null;function $(id){return document.getElementById(id)}function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}function shuffle(a){var i,j,t;for(i=a.length-1;i>0;i--){j=rnd(0,i);t=a[i];a[i]=a[j];a[j]=t}return a}function q(type,text,answer){return{type:type,text:text,answer:String(answer)}}function make(type){var a,b,c,d,qq,r,total,part,boxes,each,price;switch(type){case'basic':if(rnd(0,1)){a=rnd(2,99);b=rnd(1,99);return q(type,a+' + '+b+' = ?',a+b)}a=rnd(5,100);b=rnd(1,a);return q(type,a+' − '+b+' = ?',a-b);case'multiAddSub':if(rnd(0,1)){a=rnd(100,9999);b=rnd(100,9999);return q(type,a+' + '+b+' = ?',a+b)}a=rnd(200,9999);b=rnd(100,a);return q(type,a+' − '+b+' = ?',a-b);case'chain':a=rnd(20,80);b=rnd(2,20);c=rnd(2,20);if(rnd(0,1))return q(type,a+' + '+b+' − '+c+' = ?',a+b-c);b=Math.min(b,a);return q(type,a+' − '+b+' + '+c+' = ?',a-b+c);case'oneMulti':a=rnd(2,9);b=rnd(10,999);return q(type,a+' × '+b+' = ?',a*b);case'multiMulti':a=rnd(10,99);b=rnd(10,99);return q(type,a+' × '+b+' = ?',a*b);case'remainder':b=rnd(2,9);qq=rnd(2,9);r=rnd(1,b-1);a=b*qq+r;return q(type,a+' ÷ '+b+' = ?（如 7余4）',qq+'余'+r);case'longDiv':b=rnd(2,9);qq=rnd(10,99);a=b*qq;return q(type,a+' ÷ '+b+' = ?',qq);case'word':d=rnd(0,2);if(d===0){boxes=rnd(2,7);each=rnd(3,9);part=rnd(1,boxes*each-1);return q(type,'有 '+boxes+' 盒铅笔，每盒 '+each+' 支，送出 '+part+' 支，还剩多少支？',boxes*each-part)}if(d===1){price=rnd(3,12);total=rnd(2,8);return q(type,'一本练习册 '+price+' 元，买 '+total+' 本，一共多少元？',price*total)}a=rnd(20,80);b=rnd(5,a);c=rnd(2,20);return q(type,'小明有 '+a+' 张卡片，送出 '+b+' 张，又得到 '+c+' 张，现在有多少张？',a-b+c);case'laws':a=rnd(11,39);b=rnd(2,9);c=rnd(2,9);if(rnd(0,1))return q(type,a+' × '+b+' + '+a+' × '+c+' = ?',a*(b+c));return q(type,a+' + '+b+' + '+c+' = ?',a+b+c);case'fraction':d=rnd(0,2);if(d===0){a=[25,50,75][rnd(0,2)];return q(type,a+'% 写成小数是多少？',a/100)}if(d===1){a=[2,4,5,10][rnd(0,3)];return q(type,'1/'+a+' 写成小数是多少？',1/a)}a=[0.1,0.2,0.5,0.75][rnd(0,3)];return q(type,a+' 写成百分数是多少？',Math.round(a*100)+'%')}return q('basic','1 + 1 = ?',2)}function optionsFor(ans){var n=Number(ans),arr=[ans],x;if(isNaN(n)){if(ans.indexOf('余')>-1){var p=ans.split('余'),a=Number(p[0]),b=Number(p[1]);arr.push((a+1)+'余'+b);arr.push(Math.max(1,a-1)+'余'+b);arr.push(a+'余'+Math.max(1,b-1));return shuffle(arr)}arr.push(ans+'0','0'+ans,'1');return shuffle(arr)}while(arr.length<4){x=n+rnd(-10,10);if(x>=0&&arr.indexOf(String(x))<0)arr.push(String(x))}return shuffle(arr)}function saveWrong(item,user){var list=[];try{list=JSON.parse(localStorage.getItem(WRONG)||'[]')}catch(e){}if(!Array.isArray(list))list=[];list.unshift({type:item.type,text:item.text,answer:item.answer,user:String(user),time:Date.now()});try{localStorage.setItem(WRONG,JSON.stringify(list.slice(0,120)))}catch(e){}}function updateFill(){var t=Number($('total').value),c=Number($('choice').value);if(c>t){c=t;$('choice').value=String(c)}$('fillCount').textContent=(t-c)+' 题'}function start(){var t=Number($('total').value),c=Math.min(t,Number($('choice').value)),forms=[],i,item;questions=[];for(i=0;i<t;i++)forms.push(i<c?'choice':'fill');shuffle(forms);for(i=0;i<t;i++){item=make(types[rnd(0,types.length-1)]);item.form=forms[i];questions.push(item)}index=0;correct=0;elapsed=0;clearInterval(timerId);timerId=setInterval(function(){elapsed++;tick()},1000);$('setup').className='card hidden';$('result').className='card result hidden';$('quiz').className='card';render();tick()}function tick(){var remain=Math.max(0,LIMIT-elapsed),m=Math.floor(remain/60),s=remain%60;$('timer').textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;if(elapsed>=LIMIT){$('timerBox').className='timer done';$('timerLabel').textContent='目标时间已到'}}function render(){var item=questions[index],area=$('answerArea'),opts,i,b,input,submit,box;$('kind').textContent=labels[item.type]+' · '+(item.form==='choice'?'选择题':'填空题');$('count').textContent='第 '+(index+1)+' / '+questions.length+' 题';$('bar').style.width=((index/questions.length)*100)+'%';$('question').textContent=item.text;$('question').className=item.type==='word'?'q word':'q';$('feedback').textContent='';area.innerHTML='';if(item.form==='choice'){box=document.createElement('div');box.className='options';opts=optionsFor(item.answer);for(i=0;i<opts.length;i++){b=document.createElement('button');b.className='opt';b.textContent=opts[i];b.setAttribute('data-v',opts[i]);b.onclick=function(){judge(this.getAttribute('data-v'))};box.appendChild(b)}area.appendChild(box)}else{box=document.createElement('div');box.className='fill';input=document.createElement('input');input.inputMode='decimal';input.autocomplete='off';input.placeholder='输入答案';submit=document.createElement('button');submit.textContent='提交';submit.onclick=function(){judge(input.value)};input.onkeydown=function(e){if((e||window.event).keyCode===13)judge(input.value)};box.appendChild(input);box.appendChild(submit);area.appendChild(box);setTimeout(function(){input.focus()},50)}}function norm(v){return String(v).replace(/\s+/g,'').replace('％','%')}function judge(v){var item=questions[index],ok=norm(v)===norm(item.answer);if(ok){correct++;$('feedback').className='feedback ok';$('feedback').textContent='✓ 正确'}else{$('feedback').className='feedback bad';$('feedback').textContent='正确答案：'+item.answer;saveWrong(item,v)}setTimeout(next,430)}function next(){index++;if(index>=questions.length)finish();else render()}function finish(){clearInterval(timerId);$('quiz').className='card hidden';$('result').className='card result';var pct=Math.round(correct/questions.length*100);$('score').textContent=pct+'%';$('scoreText').textContent='答对 '+correct+' / '+questions.length+' 题';$('timeText').textContent='实际用时 '+Math.floor(elapsed/60)+' 分 '+(elapsed%60)+' 秒'+(elapsed>LIMIT?'，超过20分钟也没关系，题已经完整做完。':'')}var totalSel=$('total'),choiceSel=$('choice');$('again').onclick=function(){$('result').className='card result hidden';$('setup').className='card';totalSel.focus()}}$('total').onchange=updateFill;$('choice').onchange=updateFill;$('start').onclick=start;updateFill();tick()})();</script></body></html>
