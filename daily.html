<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>每日测试</title>
<style>
:root{--bg:#fff9f1;--card:#fff;--text:#263238;--muted:#6e7a80;--orange:#f97316;--orange2:#d95b0b;--green:#198d76;--line:#eadfd2;--red:#c2413b;--shadow:0 14px 34px rgba(80,57,31,.10)}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}button,input{font:inherit;-webkit-appearance:none}.wrap{width:min(900px,calc(100% - 28px));margin:auto;padding:24px 0 48px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}.links{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}.back{text-decoration:none;color:var(--orange2);font-weight:850}.timer{background:#263238;color:#fff;border-radius:15px;padding:9px 13px;text-align:center;min-width:108px}.timer small{display:block;opacity:.7}.timer strong{font-size:22px}.timer.done{background:var(--green)}h1{margin:0 0 5px;font-size:clamp(29px,5vw,40px)}.muted{color:var(--muted);line-height:1.7}.card{position:relative;background:#fff;border:1px solid var(--line);border-radius:26px;padding:clamp(20px,4vw,34px);box-shadow:var(--shadow)}.plan{padding:16px;border-radius:18px;background:#fbf6ef;margin:18px 0;line-height:1.8}.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.tag{font-size:12px;padding:6px 9px;border-radius:999px;background:#fff;color:#665e55;font-weight:750;border:1px solid var(--line)}.start{width:100%;border:0;border-radius:16px;padding:15px;background:linear-gradient(135deg,var(--orange),var(--orange2));color:#fff;font-weight:900;cursor:pointer}.setupLink{display:block;text-align:center;margin-top:12px;color:var(--orange2);font-weight:850;text-decoration:none}.hidden{display:none!important}.meta{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted)}.progress{height:10px;background:#eee7df;border-radius:99px;overflow:hidden;margin:12px 0 24px}.bar{height:100%;background:var(--orange);width:0}.toolbar{display:flex;justify-content:flex-end;margin:-8px 0 4px}.pauseBtn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 14px;font-weight:850;color:var(--text);cursor:pointer}.q{font-size:clamp(28px,6vw,48px);font-weight:900;text-align:center;line-height:1.45;margin:24px 0}.q.word{font-size:clamp(20px,4.2vw,32px)}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.opt{border:2px solid var(--line);background:#fff;border-radius:16px;padding:15px;font-size:20px;font-weight:850;cursor:pointer}.opt.selected{border-color:var(--orange);background:#fff4e9}.fill{display:flex;gap:10px}.fill input{flex:1;min-width:0;border:2px solid var(--line);border-radius:16px;padding:15px;font-size:22px;text-align:center}.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}.nav button{border:0;border-radius:15px;padding:14px;font-weight:900;cursor:pointer}.prev{background:#f1ede8;color:var(--text)}.next{background:var(--orange);color:#fff}.nav button:disabled{opacity:.4;cursor:default}.pauseMask{position:absolute;inset:0;border-radius:26px;background:rgba(255,255,255,.96);display:flex;align-items:center;justify-content:center;text-align:center;z-index:5;padding:30px}.pauseMask h2{font-size:32px;margin:0 0 8px}.resume{margin-top:16px;border:0;border-radius:15px;background:var(--orange);color:#fff;padding:13px 24px;font-weight:900;cursor:pointer}.result{text-align:center}.result strong{font-size:54px;color:var(--orange)}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}.actions a,.actions button{border:0;border-radius:14px;padding:13px 18px;font-weight:850;text-decoration:none;cursor:pointer}.actions button{background:var(--orange);color:#fff}.actions a{background:#f0ece7;color:var(--text)}@media(max-width:700px){.options{grid-template-columns:1fr}.top{align-items:flex-start}.fill{flex-direction:column}.nav{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<main class="wrap">
<div class="top"><div><h1>每日测试</h1><div class="muted">每天直接使用家长保存的固定训练方案。</div></div><div><div id="timerBox" class="timer"><small id="timerLabel">目标剩余</small><strong id="timer">20:00</strong></div><div class="links"><a class="back" href="./daily-settings.html">⚙ 修改设置</a><a class="back" href="./index.html">← 首页</a></div></div></div>
<section id="ready" class="card"><h2>今日训练方案</h2><div id="noPlan" class="hidden"><p class="muted">还没有保存每日训练方案。请先由家长选择题库和试卷设置。</p><a class="setupLink" href="./daily-settings.html">去设置每日训练 →</a></div><div id="hasPlan" class="hidden"><div id="plan" class="plan"></div><button id="start" class="start">开始今日测试</button><a class="setupLink" href="./daily-settings.html">需要调整？进入每日训练设置</a></div></section>
<section id="quiz" class="card hidden"><div id="pauseMask" class="pauseMask hidden"><div><h2>已暂停</h2><p class="muted">计时已经停止，答案都已保留。</p><button id="resume" class="resume">继续答题</button></div></div><div class="meta"><span id="kind"></span><span id="count"></span></div><div class="progress"><div id="bar" class="bar"></div></div><div class="toolbar"><button id="pause" class="pauseBtn">⏸ 暂停</button></div><div id="question" class="q"></div><div id="answerArea"></div><div class="nav"><button id="prev" class="prev">← 上一题</button><button id="next" class="next">下一题 →</button></div></section>
<section id="result" class="card result hidden"><h2>今日测试完成</h2><p class="muted">错题已经自动进入「错题回顾」。明天仍会按当前固定方案出卷。</p><strong id="score">0%</strong><p id="scoreText"></p><p id="timeText" class="muted"></p><div class="actions"><button id="again">再测一张</button><a href="./wrong.html">查看错题</a><a href="./daily-settings.html">修改每日设置</a><a href="./index.html">返回首页</a></div></section>
</main>
<script>
(function(){'use strict';
var WRONG='mathLearningWrongV3',CONFIG='mathDailyConfigV1',LIMIT=1200;
var labels={basic:'基础加减法',multiAddSub:'多位加减法',chain:'连加连减',oneMulti:'个位乘多位',multiMulti:'多位乘多位',remainder:'除法余数',longDiv:'多位除法',word:'应用题',laws:'运算律',fraction:'小数/分数/百分数'};
var questions=[],index=0,elapsed=0,timerId=null,config=null,paused=false;
function $(id){return document.getElementById(id)}function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}function shuffle(a){var i,j,t;for(i=a.length-1;i>0;i--){j=rnd(0,i);t=a[i];a[i]=a[j];a[j]=t}return a}function pick(a){return a[rnd(0,a.length-1)]}function q(type,text,answer){return{type:type,text:text,answer:String(answer),user:''}}
function readConfig(){var x=null;try{x=JSON.parse(localStorage.getItem(CONFIG)||'null')}catch(e){}if(!x||!x.types||!x.types.length)return null;return x}
function levelFor(mode){var n=rnd(1,100);if(mode==='easy')return n<=70?1:n<=95?2:3;if(mode==='hard')return n<=15?1:n<=55?2:3;return n<=30?1:n<=75?2:3}
function make(type,lv){var a,b,c,d,qq,r,total,part,boxes,each,price,groups,days,per,p,max,lo,hi;if(type==='basic'){max=lv===1?20:100;if(rnd(0,1)){a=rnd(1,max-1);b=rnd(1,max-a);return q(type,a+' + '+b+' = ?',a+b)}a=rnd(2,max);b=rnd(1,a);return q(type,a+' − '+b+' = ?',a-b)}if(type==='multiAddSub'){lo=lv===1?10:lv===2?100:1000;hi=lv===1?999:lv===2?9999:99999;if(rnd(0,1)){a=rnd(lo,hi);b=rnd(lo,hi);return q(type,a+' + '+b+' = ?',a+b)}a=rnd(lo*2,hi);b=rnd(lo,a);return q(type,a+' − '+b+' = ?',a-b)}if(type==='chain'){a=rnd(20,lv===1?80:lv===2?200:500);b=Math.min(rnd(2,lv===1?20:50),a);c=rnd(2,lv===1?20:50);if(lv===1)return q(type,a+' − '+b+' + '+c+' = ?',a-b+c);d=Math.min(rnd(2,lv===2?40:80),a-b+c);return q(type,a+' − '+b+' + '+c+' − '+d+' = ?',a-b+c-d)}if(type==='oneMulti'){a=rnd(2,9);b=rnd(lv===1?10:lv===2?20:100,lv===1?99:lv===2?999:1999);return q(type,a+' × '+b+' = ?',a*b)}if(type==='multiMulti'){a=rnd(10,lv===3?999:99);b=rnd(10,99);return q(type,a+' × '+b+' = ?',a*b)}if(type==='remainder'){b=rnd(2,9);qq=rnd(2,lv===1?9:lv===2?20:50);r=rnd(1,b-1);a=b*qq+r;return q(type,a+' ÷ '+b+' = ?（如 7余4）',qq+'余'+r)}if(type==='longDiv'){b=rnd(2,9);qq=rnd(lv===1?10:lv===2?20:100,lv===1?99:lv===2?999:9999);a=b*qq;return q(type,a+' ÷ '+b+' = ?',qq)}if(type==='word'){d=rnd(0,lv===1?3:8);if(d===0){boxes=rnd(2,8);each=rnd(3,9);part=rnd(1,boxes*each-1);return q(type,'有 '+boxes+' 盒彩笔，每盒 '+each+' 支，送出 '+part+' 支，还剩多少支？',boxes*each-part)}if(d===1){price=rnd(3,15);total=rnd(2,9);return q(type,'一本练习册 '+price+' 元，买 '+total+' 本，一共多少元？',price*total)}if(d===2){groups=rnd(2,6);each=rnd(12,35);return q(type,'每组有 '+each+' 名同学，一共有 '+groups+' 组。共有多少名同学？',groups*each)}if(d===3){total=rnd(40,120);part=rnd(10,total-10);a=rnd(3,12);return q(type,'图书角原有 '+total+' 本书，借走 '+part+' 本，又还回 '+a+' 本。现在有多少本？',total-part+a)}if(d===4){each=rnd(4,9);groups=rnd(3,8);part=rnd(2,10);return q(type,'学校买了 '+groups+' 包跳绳，每包 '+each+' 根，又单独买了 '+part+' 根，一共有多少根？',groups*each+part)}if(d===5){each=rnd(20,90);groups=rnd(2,6);total=each*groups;return q(type,'有 '+total+' 个球，平均装进 '+groups+' 个箱子，每箱多少个？',each)}if(d===6){days=rnd(3,7);per=rnd(8,20);part=rnd(5,15);return q(type,'小军每天读 '+per+' 页，连续读 '+days+' 天后，还剩 '+part+' 页。这本书一共有多少页？',per*days+part)}if(d===7){a=rnd(3,8);b=rnd(1,a-1);c=rnd(4,12);return q(type,'每盒彩纸有 '+c+' 张，买了 '+a+' 盒，其中用了 '+b+' 盒。还剩多少张？',(a-b)*c)}a=rnd(20,60);b=rnd(2,5);c=rnd(3,10);return q(type,'一辆车每次运 '+a+' 千克，运了 '+b+' 次后，又多运了 '+c+' 千克。一共运了多少千克？',a*b+c)}if(type==='laws'){d=rnd(0,5);if(d===0){a=rnd(11,49);b=100-a;c=rnd(2,30);return q(type,a+' + '+c+' + '+b+' = ?（先凑整）',a+b+c)}if(d===1){a=rnd(11,39);b=rnd(2,9);c=rnd(2,9);return q(type,a+' × '+b+' + '+a+' × '+c+' = ?',a*(b+c))}if(d===2){a=rnd(2,9);b=rnd(11,49);c=100-b;return q(type,a+' × '+b+' + '+a+' × '+c+' = ?',a*100)}if(d===3){a=rnd(20,80);b=rnd(2,9);c=rnd(2,9);return q(type,a+' × ('+b+' + '+c+') = ?',a*(b+c))}if(d===4){a=rnd(101,499);b=rnd(1,49);c=100-b;return q(type,a+' + '+b+' + '+c+' = ?',a+100)}a=rnd(11,49);b=rnd(5,9);c=rnd(2,b);return q(type,a+' × '+b+' − '+a+' × '+c+' = ?',a*(b-c))}if(type==='fraction'){d=rnd(0,6);if(d===0){p=pick([['25%','0.25'],['50%','0.5'],['75%','0.75'],['10%','0.1'],['20%','0.2']]);return q(type,p[0]+' 写成小数是多少？',p[1])}if(d===1){p=pick([['1/2','0.5'],['1/4','0.25'],['3/4','0.75'],['1/5','0.2']]);return q(type,p[0]+' 写成小数是多少？',p[1])}if(d===2){p=pick([['0.25','25%'],['0.5','50%'],['0.75','75%'],['0.2','20%'],['0.1','10%']]);return q(type,p[0]+' 写成百分数是多少？',p[1])}if(d===3){p=pick([['1/2','50%'],['1/4','25%'],['3/4','75%'],['1/5','20%']]);return q(type,p[0]+' 写成百分数是多少？',p[1])}if(d===4){a=pick([20,40,60,80,100]);b=pick([10,25,50]);return q(type,a+' 的 '+b+'% 是多少？',a*b/100)}if(d===5){a=pick([20,40,60,80,100]);return q(type,a+' 的 1/2 是多少？',a/2)}a=pick([40,80,120,160]);return q(type,a+' 的 1/4 是多少？',a/4)}return q('basic','1 + 1 = ?',2)}
function optionsFor(ans){var n=Number(ans),arr=[ans],x,p,qq,rr;if(isNaN(n)){if(ans.indexOf('余')>-1){p=ans.split('余');qq=Number(p[0]);rr=Number(p[1]);arr.push((qq+1)+'余'+rr);arr.push(Math.max(1,qq-1)+'余'+rr);arr.push(qq+'余'+(rr+1));return shuffle(arr)}if(ans.indexOf('%')>-1){n=Number(ans.replace('%',''));arr=[ans,Math.max(0,n-10)+'%',(n+10)+'%',Math.max(0,n-25)+'%'];return shuffle(arr)}arr.push(ans+'0','0'+ans,'1');return shuffle(arr)}while(arr.length<4){x=n+rnd(-Math.max(3,Math.round(Math.abs(n)*.12)),Math.max(3,Math.round(Math.abs(n)*.12)));if(x>=0&&arr.indexOf(String(x))<0)arr.push(String(x))}return shuffle(arr)}
function buildTypePlan(total,types){var a=[],i;if(total>=types.length){for(i=0;i<types.length;i++)a.push(types[i])}while(a.length<total)a.push(pick(types));return shuffle(a)}
function showPlan(){var names=[],i,lv={easy:'基础为主',mix:'均衡',hard:'进阶为主'};config=readConfig();if(!config){$('noPlan').className='';$('hasPlan').className='hidden';return}$('noPlan').className='hidden';$('hasPlan').className='';for(i=0;i<config.types.length;i++)names.push(labels[config.types[i]]||config.types[i]);$('plan').innerHTML='<b>固定题库：</b><div class="tags">'+names.map(function(n){return '<span class="tag">'+n+'</span>'}).join('')+'</div><br><b>试卷：</b>'+config.total+' 题，其中选择题 '+config.choice+' 题、填空题 '+(config.total-config.choice)+' 题；难度：'+(lv[config.level]||'均衡')+'。'}
function start(){var t=Number(config.total),c=Math.min(t,Number(config.choice)),forms=[],plan=buildTypePlan(t,config.types),i,item;questions=[];for(i=0;i<t;i++)forms.push(i<c?'choice':'fill');shuffle(forms);for(i=0;i<t;i++){item=make(plan[i],levelFor(config.level||'mix'));item.form=forms[i];item.options=item.form==='choice'?optionsFor(item.answer):null;questions.push(item)}index=0;elapsed=0;paused=false;clearInterval(timerId);timerId=setInterval(function(){if(!paused){elapsed++;tick()}},1000);$('ready').className='card hidden';$('result').className='card result hidden';$('quiz').className='card';$('pauseMask').className='pauseMask hidden';$('timerBox').className='timer';$('timerLabel').textContent='目标剩余';render();tick()}
function tick(){var remain=Math.max(0,LIMIT-elapsed),m=Math.floor(remain/60),s=remain%60;$('timer').textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;if(elapsed>=LIMIT){$('timerBox').className='timer done';$('timerLabel').textContent='目标时间已到'}}
function saveCurrentFill(){var input=$('fillInput');if(input&&questions[index])questions[index].user=input.value}
function render(){var item=questions[index],area=$('answerArea'),i,b,box,input;$('kind').textContent=labels[item.type]+' · '+(item.form==='choice'?'选择题':'填空题');$('count').textContent='第 '+(index+1)+' / '+questions.length+' 题';$('bar').style.width=(((index+1)/questions.length)*100)+'%';$('question').textContent=item.text;$('question').className=item.type==='word'?'q word':'q';area.innerHTML='';if(item.form==='choice'){box=document.createElement('div');box.className='options';for(i=0;i<item.options.length;i++){b=document.createElement('button');b.className='opt'+(item.user===item.options[i]?' selected':'');b.textContent=item.options[i];b.setAttribute('data-v',item.options[i]);b.onclick=function(){item.user=this.getAttribute('data-v');render()};box.appendChild(b)}area.appendChild(box)}else{box=document.createElement('div');box.className='fill';input=document.createElement('input');input.id='fillInput';input.setAttribute('inputmode','decimal');input.setAttribute('autocomplete','off');input.placeholder='输入答案';input.value=item.user||'';input.oninput=function(){item.user=input.value};box.appendChild(input);area.appendChild(box);setTimeout(function(){try{input.focus()}catch(e){}},50)}$('prev').disabled=index===0;$('next').textContent=index===questions.length-1?'交卷':'下一题 →'}
function goPrev(){saveCurrentFill();if(index>0){index--;render()}}
function goNext(){saveCurrentFill();if(index<questions.length-1){index++;render();return}finish()}
function togglePause(state){paused=state;$('pauseMask').className=state?'pauseMask':'pauseMask hidden';$('pause').textContent=state?'▶ 继续':'⏸ 暂停';$('timerLabel').textContent=state?'已暂停':(elapsed>=LIMIT?'目标时间已到':'目标剩余')}
function norm(v){return String(v).replace(/\s+/g,'').replace('％','%').replace('。','.')}
function saveWrong(item){var list=[];try{list=JSON.parse(localStorage.getItem(WRONG)||'[]')}catch(e){}if(!Array.isArray(list))list=[];list.unshift({type:item.type,text:item.text,answer:item.answer,user:String(item.user||''),time:Date.now()});try{localStorage.setItem(WRONG,JSON.stringify(list.slice(0,120)))}catch(e){}}
function finish(){var i,item,correct=0,unanswered=0;saveCurrentFill();for(i=0;i<questions.length;i++){item=questions[i];if(!norm(item.user)){unanswered++}else if(norm(item.user)===norm(item.answer)){correct++}else{saveWrong(item)}}if(unanswered>0){alert('还有 '+unanswered+' 题没有作答，请先完成后再交卷。');for(i=0;i<questions.length;i++){if(!norm(questions[i].user)){index=i;render();return}}}clearInterval(timerId);paused=false;$('quiz').className='card hidden';$('result').className='card result';var pct=Math.round(correct/questions.length*100);$('score').textContent=pct+'%';$('scoreText').textContent='答对 '+correct+' / '+questions.length+' 题';$('timeText').textContent='实际用时 '+Math.floor(elapsed/60)+' 分 '+(elapsed%60)+' 秒'+(elapsed>LIMIT?'，超过20分钟也没关系，题已经完整做完。':'')}
$('start').onclick=start;$('prev').onclick=goPrev;$('next').onclick=goNext;$('pause').onclick=function(){togglePause(!paused)};$('resume').onclick=function(){togglePause(false)};$('again').onclick=function(){config=readConfig();start()};showPlan();tick();
})();
</script>
</body>
</html>
