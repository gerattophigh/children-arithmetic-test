<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>儿童数学小工具</title><style>:root{--bg:#fffaf2;--card:#fff;--text:#243238;--muted:#6f7b82;--orange:#f97316;--green:#15947f;--blue:#4f67d8;--line:#eadfd2;--shadow:0 16px 38px rgba(70,55,35,.11)}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:radial-gradient(circle at 8% 5%,#ffe9b8 0,transparent 24%),radial-gradient(circle at 92% 10%,#dff4ef 0,transparent 22%),var(--bg)}a{text-decoration:none;color:inherit}.wrap{width:min(980px,calc(100% - 28px));margin:auto;padding:32px 0 48px}.head{display:flex;gap:14px;align-items:center;margin-bottom:22px}.logo{width:58px;height:58px;border-radius:19px;background:#ffd866;display:grid;place-items:center;font-size:30px;box-shadow:var(--shadow)}h1{margin:0;font-size:clamp(30px,5vw,44px)}.sub{margin:5px 0 0;color:var(--muted)}.hero{background:rgba(255,255,255,.94);padding:clamp(24px,5vw,42px);border-radius:30px;box-shadow:var(--shadow)}.hero h2{font-size:clamp(28px,5vw,42px);margin:0 0 8px}.hero>p{color:var(--muted);line-height:1.8;margin:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:24px}.entry{padding:26px 22px;border-radius:24px;background:#fff;border:1px solid var(--line);min-height:260px;display:flex;flex-direction:column;box-shadow:0 8px 22px rgba(70,55,35,.07)}.entry .icon{font-size:38px}.entry h3{font-size:25px;margin:12px 0 8px}.entry p{color:var(--muted);line-height:1.7;margin:0}.go{margin-top:auto;padding-top:20px;font-weight:900}.daily .go{color:var(--orange)}.special .go{color:var(--green)}.wrong .go{color:var(--blue)}.settings{display:inline-block;margin-top:10px;color:var(--muted);font-size:13px;font-weight:800}.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:18px}@media(max-width:760px){.grid{grid-template-columns:1fr}.entry{min-height:200px}.wrap{padding-top:20px}}</style></head><body><main class="wrap"><header class="head"><div class="logo">✏️</div><div><h1>儿童数学小工具</h1><p class="sub">每天测试、专项突破、错题回头看。</p></div></header><section class="hero"><h2>今天从哪里开始？</h2><p>家长先设置每日训练方案，孩子以后每天直接开始测试；专项练习按需要单独强化，错题统一回顾。</p><div class="grid"><div class="entry daily"><div class="icon">📝</div><h3>每日测试</h3><p>使用已经保存好的固定题库、题数、难度和选择/填空比例。每天打开即可直接做，不需要重复设置。</p><a class="go" href="./daily.html">开始今日测试 →</a><a class="settings" href="./daily-settings.html">⚙ 每日训练设置</a></div><a class="entry special" href="./special.html"><div class="icon">🎯</div><h3>专项练习</h3><p>加减法、乘除法、应用题、数学技巧。按某一个知识点单独强化，并可自由设置题量和题型形式。</p><span class="go">选择专项 →</span></a><a class="entry wrong" href="./wrong.html"><div class="icon">📚</div><h3>错题回顾</h3><p>统一查看每日测试和专项练习中的错题，重新练习，答对后可从错题库中移除。</p><span class="go">查看错题 →</span></a></div></section><p class="foot">每日训练方案和学习记录保存在当前设备浏览器中。</p></main></body></html>
