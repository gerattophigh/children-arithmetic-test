<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>错题回顾</title><style>:root{--bg:#f7f8ff;--card:#fff;--text:#263238;--muted:#6f7783;--blue:#5267d7;--blue2:#3949ab;--green:#178f72;--red:#c2413b;--line:#e1e4f0;--shadow:0 14px 34px rgba(53,62,120,.10)}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}button,input{font:inherit}.wrap{width:min(900px,calc(100% - 28px));margin:auto;padding:24px 0 48px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:18px}h1{margin:0 0 5px;font-size:clamp(29px,5vw,40px)}.muted{color:var(--muted);line-height:1.7}.back{text-decoration:none;color:var(--blue2);font-weight:850}.card{background:#fff;border:1px solid var(--line);border-radius:26px;padding:clamp(20px,4vw,34px);box-shadow:var(--shadow)}.summary{display:flex;justify-content:space-between;gap:12px;align-items:center}.summary strong{font-size:34px;color:var(--blue)}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:0;border-radius:13px;padding:11px 15px;font-weight:850;cursor:pointer}.primary{background:var(--blue);color:#fff}.light{background:#eef0fa;color:var(--blue2)}.danger{background:#fff0ef;color:var(--red)}.list{display:grid;gap:10px;margin-top:18px}.item{border:1px solid var(--line);border-radius:18px;padding:15px;background:#fff}.item .type{font-size:12px;color:var(--blue2);font-weight:850;margin-bottom:7px}.item .q{font-size:18px;font-weight:800;line-height:1.55}.item .ans{margin-top:8px;color:var(--muted);font-size:14px}.empty{text-align:center;padding:46px 15px}.empty .emoji{font-size:48px}.hidden{display:none!important}.reviewMeta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}.progress{height:9px;background:#edf0f7;border-radius:99px;overflow:hidden;margin:12px 0 24px}.bar{height:100%;background:var(--blue);width:0}.reviewQ{text-align:center;font-size:clamp(25px,5vw,42px);font-weight:900;line-height:1.5;margin:26px 0}.fill{display:flex;gap:10px}.fill input{flex:1;min-width:0;border:2px solid var(--line);border-radius:16px;padding:15px;font-size:22px;text-align:center}.fill button{border:0;border-radius:16px;padding:0 22px;background:var(--blue);color:#fff;font-weight:900}.feedback{text-align:center;min-height:30px;margin-top:13px;font-weight:850}.ok{color:var(--green)}.bad{color:var(--red)}@media(max-width:680px){.summary{align-items:flex-start;flex-direction:column}.fill{flex-direction:column}.fill button{padding:14px}.top{align-items:flex-start}}</style></head><body><main class="wrap"><div class="top"><div><h1>错题回顾</h1><div class="muted">不是“看一眼答案”，而是重新做对一次。</div></div><a class="back" href="./index.html">← 首页</a></div><section id="overview" class="card"><div id="summary" class="summary"></div><div id="list" class="list"></div></section><section id="review" class="card hidden"><div class="reviewMeta"><span id="reviewType"></span><span id="reviewCount"></span></div><div class="progress"><div id="bar" class="bar"></div></div><div id="reviewQ" class="reviewQ"></div><div class="fill"><input id="input" autocomplete="off" inputmode="decimal" placeholder="重新输入正确答案"><button id="submit">提交</button></div><div id="feedback" class="feedback"></div><div class="actions" style="margin-top:18px"><button id="stop" class="btn light">结束回顾</button></div></section></main><script>(function(){'use strict';var KEY='mathLearningWrongV3';var labels={basic:'基础加减法',multiAddSub:'多位加减法',chain:'连加连减',oneMulti:'个位乘多位',multiMulti:'多位乘多位',remainder:'除法余数',longDiv:'多位除法',word:'应用题',laws:'运算律',fraction:'小数/分数/百分数'};var all=[],session=[],index=0;function $(id){return document.getElementById(id)}function load(){try{all=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){all=[]}if(!Array.isArray(all))all=[]}function save(){try{localStorage.setItem(KEY,JSON.stringify(all.slice(0,120)))}catch(e){}}function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function renderOverview(){load();$('overview').className='card';$('review').className='card hidden';if(!all.length){$('summary').innerHTML='<div><strong>0</strong><div class="muted">当前没有错题</div></div>';$('list').innerHTML='<div class="empty"><div class="emoji">🎉</div><h2>错题库是空的</h2><p class="muted">继续保持。新的错题会从每日测试和专项练习自动进入这里。</p></div>';return}$('summary').innerHTML='<div><strong>'+all.length+'</strong><div class="muted">道待回顾错题</div></div><div class="actions"><button id="reviewAll" class="btn primary">全部重新练</button><button id="clearAll" class="btn danger">清空错题库</button></div>';var html='',i,item;for(i=0;i<all.length;i++){item=all[i];html+='<div class="item"><div class="type">'+esc(labels[item.type]||'数学练习')+'</div><div class="q">'+esc(item.text)+'</div><div class="ans">上次答案：'+esc(item.user||'未答')+'　·　正确答案：'+esc(item.answer)+'</div></div>'}$('list').innerHTML=html;$('reviewAll').onclick=startReview;$('clearAll').onclick=function(){if(window.confirm('确定清空全部错题吗？')){all=[];save();renderOverview()}}}function startReview(){load();session=all.slice();index=0;if(!session.length)return;$('overview').className='card hidden';$('review').className='card';renderQuestion()}function renderQuestion(){var item=session[index];$('reviewType').textContent=labels[item.type]||'数学练习';$('reviewCount').textContent='第 '+(index+1)+' / '+session.length+' 题';$('bar').style.width=((index/session.length)*100)+'%';$('reviewQ').textContent=item.text;$('feedback').textContent='';$('input').value='';setTimeout(function(){$('input').focus()},40)}function norm(v){return String(v).replace(/\s+/g,'').replace('％','%')}function submit(){var item=session[index],value=$('input').value;if(norm(value)===norm(item.answer)){$('feedback').className='feedback ok';$('feedback').textContent='✓ 做对了，这道题从错题库移除';removeOne(item);setTimeout(next,500)}else{$('feedback').className='feedback bad';$('feedback').textContent='还不对。正确答案是：'+item.answer}}function removeOne(target){var i;for(i=0;i<all.length;i++){if(all[i].time===target.time&&all[i].text===target.text){all.splice(i,1);break}}save()}function next(){index++;if(index>=session.length){renderOverview()}else renderQuestion()}$('submit').onclick=submit;$('input').onkeydown=function(e){if((e||window.event).keyCode===13)submit()};$('stop').onclick=renderOverview;renderOverview()})();</script></body></html>
