<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>每日训练设置</title><style>:root{--bg:#fff9f1;--card:#fff;--text:#263238;--muted:#6e7a80;--orange:#f97316;--orange2:#d95b0b;--green:#198d76;--line:#eadfd2;--shadow:0 14px 34px rgba(80,57,31,.10)}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}.wrap{width:min(920px,calc(100% - 28px));margin:auto;padding:24px 0 48px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.back{text-decoration:none;color:var(--orange2);font-weight:850}.card{background:#fff;border:1px solid var(--line);border-radius:26px;padding:clamp(20px,4vw,34px);box-shadow:var(--shadow)}h1{margin:0 0 5px;font-size:clamp(29px,5vw,40px)}h2{margin:24px 0 10px}.muted{color:var(--muted);line-height:1.7}.types{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.type{display:flex;align-items:flex-start;gap:10px;padding:14px;border:1px solid var(--line);border-radius:16px;background:#fff;cursor:pointer}.type input{width:21px;height:21px;margin-top:1px}.type b{display:block}.type small{display:block;color:var(--muted);margin-top:4px;line-height:1.5}.group-title{margin:18px 0 8px;font-weight:900}.config{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.field{background:#fbf6ef;border-radius:15px;padding:12px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field select{width:100%;border:0;background:transparent;font-weight:850}.summary{margin-top:18px;padding:14px;border-radius:16px;background:#f7f3ec;color:#5f5a53;line-height:1.7}.save{width:100%;margin-top:16px;border:0;border-radius:16px;padding:15px;background:linear-gradient(135deg,var(--orange),var(--orange2));color:#fff;font-weight:900;cursor:pointer}.saved{display:none;margin-top:12px;color:var(--green);font-weight:850;text-align:center}.actions{display:flex;gap:10px;justify-content:center;margin-top:14px}.actions a{text-decoration:none;padding:12px 16px;border-radius:14px;background:#f0ece7;color:var(--text);font-weight:850}@media(max-width:700px){.types,.config{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><div><h1>每日训练设置</h1><div class="muted">这里由家长设置一次，之后每天直接按这套方案出卷。</div></div><a class="back" href="./index.html">← 首页</a></div><section class="card"><div class="group-title">一、加减法</div><div class="types"><label class="type"><input type="checkbox" value="basic"><span><b>基础加减法</b><small>20 / 100以内基础计算</small></span></label><label class="type"><input type="checkbox" value="multiAddSub"><span><b>多位加减法</b><small>多位数进位、借位</small></span></label><label class="type"><input type="checkbox" value="chain"><span><b>连加连减</b><small>连续两步到三步计算</small></span></label></div><div class="group-title">二、乘除法</div><div class="types"><label class="type"><input type="checkbox" value="oneMulti"><span><b>个位乘多位</b><small>2～9 乘两位或多位数</small></span></label><label class="type"><input type="checkbox" value="multiMulti"><span><b>多位乘多位</b><small>两位数乘两位数等</small></span></label><label class="type"><input type="checkbox" value="remainder"><span><b>除法余数</b><small>带余数除法</small></span></label><label class="type"><input type="checkbox" value="longDiv"><span><b>多位除法</b><small>多位数除以一位数</small></span></label></div><div class="group-title">三、应用题</div><div class="types"><label class="type"><input type="checkbox" value="word"><span><b>混合应用题</b><small>加减乘除生活情境题</small></span></label></div><div class="group-title">四、数学技巧</div><div class="types"><label class="type"><input type="checkbox" value="laws"><span><b>运算律</b><small>凑整、交换律、结合律、分配律</small></span></label><label class="type"><input type="checkbox" value="fraction"><span><b>小数、分数、百分数</b><small>等值转换与简单计算</small></span></label></div><h2>试卷设置</h2><div class="config"><div class="field"><label>难度</label><select id="level"><option value="easy">基础为主</option><option value="mix">均衡</option><option value="hard">进阶为主</option></select></div><div class="field"><label>每天总题数</label><select id="total"><option>10</option><option>20</option><option>30</option><option>40</option><option>60</option></select></div><div class="field"><label>其中选择题</label><select id="choice"><option>0</option><option>5</option><option>10</option><option>15</option><option>20</option><option>30</option></select></div></div><div id="summary" class="summary"></div><button id="save" class="save">保存为每日训练方案</button><div id="saved" class="saved">✓ 已保存，以后每日测试会直接使用这套方案</div><div class="actions"><a href="./daily.html">去做每日测试 →</a></div></section></main><script>(function(){'use strict';var KEY='mathDailyConfigV1';var defaults={types:['basic','multiAddSub','chain','oneMulti','remainder','word'],level:'mix',total:30,choice:15};var labels={basic:'基础加减法',multiAddSub:'多位加减法',chain:'连加连减',oneMulti:'个位乘多位',multiMulti:'多位乘多位',remainder:'除法余数',longDiv:'多位除法',word:'应用题',laws:'运算律',fraction:'小数/分数/百分数'};function $(id){return document.getElementById(id)}function read(){var x=null;try{x=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}if(!x||!x.types||!x.types.length)return defaults;return x}function checked(){var all=document.querySelectorAll('input[type=checkbox]'),a=[],i;for(i=0;i<all.length;i++)if(all[i].checked)a.push(all[i].value);return a}function syncChoice(){var t=Number($('total').value),c=Number($('choice').value);if(c>t){c=t;$('choice').value=String(c)}}function summary(){syncChoice();var a=checked(),names=[],i;for(i=0;i<a.length;i++)names.push(labels[a[i]]);$('summary').textContent='题库：'+(names.length?names.join('、'):'尚未选择')+'；每天 '+$('total').value+' 题，其中选择题 '+$('choice').value+' 题、填空题 '+(Number($('total').value)-Number($('choice').value))+' 题；难度：'+$('level').options[$('level').selectedIndex].text+'.'}function load(){var c=read(),all=document.querySelectorAll('input[type=checkbox]'),i;for(i=0;i<all.length;i++)all[i].checked=c.types.indexOf(all[i].value)>-1;$('level').value=c.level||'mix';$('total').value=String(c.total||30);$('choice').value=String(c.choice||15);summary()}function save(){var a=checked(),c;if(!a.length){alert('请至少选择一个题库。');return}syncChoice();c={types:a,level:$('level').value,total:Number($('total').value),choice:Number($('choice').value)};try{localStorage.setItem(KEY,JSON.stringify(c));$('saved').style.display='block'}catch(e){alert('浏览器未能保存设置，请检查 Safari 是否关闭了网站数据存储。')}summary()}var all=document.querySelectorAll('input,select'),i;for(i=0;i<all.length;i++)all[i].onchange=summary;$('save').onclick=save;load()})();</script></body></html>
