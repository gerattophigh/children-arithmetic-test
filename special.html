<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>专项练习</title><style>:root{--bg:#f7fbf9;--card:#fff;--text:#243238;--muted:#6e7a80;--green:#178f7e;--green2:#0b6d61;--line:#dce8e3;--red:#c2413b;--shadow:0 14px 34px rgba(43,74,64,.10)}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}.wrap{width:min(980px,calc(100% - 28px));margin:auto;padding:24px 0 48px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:18px}.back{color:var(--green2);font-weight:800;text-decoration:none}.card{background:#fff;border:1px solid var(--line);border-radius:26px;padding:clamp(20px,4vw,34px);box-shadow:var(--shadow)}h1{margin:0 0 6px;font-size:clamp(28px,5vw,40px)}.muted{color:var(--muted);line-height:1.7}.groups{display:grid;gap:16px;margin-top:22px}.group{border:1px solid var(--line);border-radius:22px;padding:18px}.group h2{margin:0 0 12px;font-size:21px}.types{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.type{border:1px solid var(--line);background:#f8fcfa;border-radius:16px;padding:14px;text-align:left;cursor:pointer;font-weight:800}.type small{display:block;color:var(--muted);font-weight:500;margin-top:5px}.type.active{border:2px solid var(--green);background:#edf9f5}.config{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}.field{background:#f7faf8;border-radius:15px;padding:12px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field select{width:100%;border:0;background:transparent;font-weight:800}.start{width:100%;margin-top:14px;border:0;border-radius:16px;padding:15px;background:linear-gradient(135deg,var(--green),var(--green2));color:white;font-weight:900;cursor:pointer}.hidden{display:none!important}.progress{height:10px;background:#edf1ef;border-radius:99px;overflow:hidden;margin:14px 0 24px}.bar{height:100%;background:var(--green);width:0}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}.q{font-size:clamp(28px,6vw,48px);font-weight:900;text-align:center;line-height:1.45;margin:24px 0}.q.word{font-size:clamp(20px,4.2vw,32px)}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.opt{border:2px solid var(--line);border-radius:16px;background:#fff;padding:15px;font-size:20px;font-weight:850;cursor:pointer}.fill{display:flex;gap:10px}.fill input{flex:1;min-width:0;border:2px solid var(--line);border-radius:16px;padding:15px;font-size:22px;text-align:center}.fill button{border:0;border-radius:16px;padding:0 22px;background:var(--green);color:#fff;font-weight:900}.feedback{text-align:center;min-height:28px;margin-top:13px;font-weight:800}.ok{color:var(--green2)}.bad{color:var(--red)}.result{text-align:center}.result strong{font-size:54px;color:var(--green)}.again{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}.again a,.again button{border:0;border-radius:14px;padding:13px 18px;font-weight:850;text-decoration:none;cursor:pointer}.again button{background:var(--green);color:white}.again a{background:#eef3f1;color:var(--text)}@media(max-width:760px){.types{grid-template-columns:1fr}.config{grid-template-columns:1fr 1fr}.options{grid-template-columns:1fr}.top{align-items:flex-start}}@media(max-width:480px){.config{grid-template-columns:1fr}.fill{flex-direction:column}.fill button{padding:14px}}</style></head><body><main class="wrap"><div class="top"><div><h1>专项练习</h1><div class="muted">选一个知识点，再选难度和题目形式。</div></div><a class="back" href="./index.html">← 首页</a></div><section id="setup" class="card"><div class="groups"><div class="group"><h2>一、加减法</h2><div class="types"><button class="type active" data-type="basic"><b>基础加减法</b><small>20 / 100以内，不出现负数</small></button><button class="type" data-type="multiAddSub"><b>多位加减法</b><small>2～4位数进位、借位</small></button><button class="type" data-type="chain"><b>连加连减</b><small>两步到四步，过程保持非负</small></button></div></div><div class="group"><h2>二、乘除法</h2><div class="types"><button class="type" data-type="oneMulti"><b>个位乘多位</b><small>2～9 × 两/三位数</small></button><button class="type" data-type="multiMulti"><b>多位乘多位</b><small>两位数 × 两位数，挑战档加入三位×两位</small></button><button class="type" data-type="remainder"><b>除法余数</b><small>余数始终小于除数</small></button><button class="type" data-type="longDiv"><b>多位除法</b><small>整除为主，逐步扩大被除数</small></button></div></div><div class="group"><h2>三、应用题</h2><div class="types"><button class="type" data-type="word"><b>混合加减乘除应用题</b><small>购物、分组、路程、剩余、倍数等情境</small></button></div></div><div class="group"><h2>四、数学技巧</h2><div class="types"><button class="type" data-type="laws"><b>运算律</b><small>交换律、结合律、分配律与凑整</small></button><button class="type" data-type="fraction"><b>小数、分数、百分数</b><small>等值转换与简单计算</small></button></div></div></div><div class="config"><div class="field"><label>难度</label><select id="level"><option value="1">基础</option><option value="2" selected>进阶</option><option value="3">挑战</option></select></div><div class="field"><label>总题数</label><select id="total"><option>10</option><option selected>20</option><option>30</option><option>40</option></select></div><div class="field"><label>选择题数量</label><select id="choice"><option>0</option><option>5</option><option selected>10</option><option>15</option><option>20</option><option>30</option></select></div><div class="field"><label>填空题数量</label><div id="fillCount" style="font-weight:900;padding-top:3px">10 题</div></div></div><button id="start" class="start">开始专项练习</button></section><section id="quiz" class="card hidden"><div class="meta"><span id="kind"></span><span id="count"></span></div><div class="progress"><div id="bar" class="bar"></div></div><div id="question" class="q"></div><div id="answerArea"></div><div id="feedback" class="feedback"></div></section><section id="result" class="card result hidden"><h2>专项练习完成</h2><p class="muted">错题已进入错题回顾。</p><strong id="score">0%</strong><p id="scoreText"></p><div class="again"><button id="again">再练一组</button><a href="./wrong.html">错题回顾</a><a href="./index.html">返回首页</a></div></section></main><script>(function(){'use strict';var WRONG='mathLearningWrongV3';var selected='basic',questions=[],index=0,correct=0;var labels={basic:'基础加减法',multiAddSub:'多位加减法',chain:'连加连减',oneMulti:'个位乘多位',multiMulti:'多位乘多位',remainder:'除法余数',longDiv:'多位除法',word:'应用题',laws:'运算律',fraction:'小数/分数/百分数'};function $(id){return document.getElementById(id)}function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}function shuffle(a){var i,j,t;for(i=a.length-1;i>0;i--){j=rnd(0,i);t=a[i];a[i]=a[j];a[j]=t}return a}function q(type,text,answer){return{type:type,text:text,answer:String(answer)}}function pick(a){return a[rnd(0,a.length-1)]}function make(type,lv){var a,b,c,d,e,qq,r,total,part,boxes,each,price,groups,students,days,per,base,pairs;if(type==='basic'){var max=lv===1?20:100;if(rnd(0,1)){a=rnd(1,max-1);b=rnd(1,max-a);return q(type,a+' + '+b+' = ?',a+b)}a=rnd(2,max);b=rnd(1,a);return q(type,a+' − '+b+' = ?',a-b)}if(type==='multiAddSub'){var lo=lv===1?10:lv===2?100:1000,hi=lv===1?999:lv===2?9999:99999;if(rnd(0,1)){a=rnd(lo,hi);b=rnd(lo,hi);return q(type,a+' + '+b+' = ?',a+b)}a=rnd(lo*2,hi);b=rnd(lo,a);return q(type,a+' − '+b+' = ?',a-b)}if(type==='chain'){a=rnd(20,lv===1?80:lv===2?200:500);b=rnd(2,lv===1?20:50);c=rnd(2,lv===1?20:50);if(lv===1)return q(type,a+' + '+b+' − '+Math.min(c,a+b)+' = ?',a+b-Math.min(c,a+b));d=rnd(2,lv===2?40:80);if(lv===2)return q(type,a+' − '+Math.min(b,a)+' + '+c+' − '+Math.min(d,a-Math.min(b,a)+c)+' = ?',a-Math.min(b,a)+c-Math.min(d,a-Math.min(b,a)+c));e=rnd(2,80);return q(type,a+' + '+b+' − '+Math.min(c,a+b)+' + '+d+' − '+Math.min(e,a+b-Math.min(c,a+b)+d)+' = ?',a+b-Math.min(c,a+b)+d-Math.min(e,a+b-Math.min(c,a+b)+d))}if(type==='oneMulti'){a=rnd(2,9);b=rnd(lv===1?10:lv===2?20:100,lv===1?99:lv===2?999:1999);return q(type,a+' × '+b+' = ?',a*b)}if(type==='multiMulti'){a=rnd(10,lv===3?999:99);b=rnd(10,99);return q(type,a+' × '+b+' = ?',a*b)}if(type==='remainder'){b=rnd(2,9);qq=rnd(2,lv===1?9:lv===2?20:50);r=rnd(1,b-1);a=b*qq+r;return q(type,a+' ÷ '+b+' = ?（如 7余4）',qq+'余'+r)}if(type==='longDiv'){b=rnd(2,9);qq=rnd(lv===1?10:lv===2?20:100,lv===1?99:lv===2?999:9999);a=b*qq;return q(type,a+' ÷ '+b+' = ?',qq)}if(type==='word'){d=rnd(0,lv===1?3:lv===2?6:8);if(d===0){boxes=rnd(2,8);each=rnd(3,9);part=rnd(1,boxes*each-1);return q(type,'有 '+boxes+' 盒彩笔，每盒 '+each+' 支，送出 '+part+' 支，还剩多少支？',boxes*each-part)}if(d===1){price=rnd(3,15);total=rnd(2,9);return q(type,'一本练习册 '+price+' 元，买 '+total+' 本，一共多少元？',price*total)}if(d===2){students=rnd(18,45);groups=rnd(2,6);total=students*groups;return q(type,'每组有 '+students+' 名同学，一共有 '+groups+' 组。参加活动的一共有多少名同学？',total)}if(d===3){total=rnd(40,120);part=rnd(10,total-10);return q(type,'图书角原有 '+total+' 本书，借走 '+part+' 本，又还回 '+rnd(3,12)+' 本。现在有多少本？',0)}if(d===4){each=rnd(4,9);groups=rnd(3,8);part=rnd(2,10);return q(type,'学校买了 '+groups+' 包跳绳，每包 '+each+' 根，又单独买了 '+part+' 根，一共有多少根？',groups*each+part)}if(d===5){total=rnd(30,90);groups=rnd(2,6);a=total*groups;return q(type,'仓库有 '+a+' 个球，平均装进 '+groups+' 个箱子，每箱多少个？',total)}if(d===6){days=rnd(3,7);per=rnd(8,20);part=rnd(5,15);return q(type,'小军每天读 '+per+' 页，连续读 '+days+' 天后，还剩 '+part+' 页。这本书一共有多少页？',per*days+part)}if(d===7){a=rnd(3,8);b=rnd(2,6);c=rnd(4,12);return q(type,'每盒彩纸有 '+c+' 张，买了 '+a+' 盒，其中用了 '+b+' 盒。还剩多少张彩纸？',(a-b)*c)}base=rnd(20,60);b=rnd(2,5);c=rnd(3,10);return q(type,'一辆车每次运 '+base+' 千克，运了 '+b+' 次后，又多运了 '+c+' 千克。一共运了多少千克？',base*b+c)}if(type==='laws'){d=rnd(0,lv===1?2:lv===2?5:7);if(d===0){a=rnd(11,49);b=100-a;c=rnd(2,30);return q(type,a+' + '+c+' + '+b+' = ?（先凑整）',a+b+c)}if(d===1){a=rnd(11,39);b=rnd(2,9);c=rnd(2,9);return q(type,a+' × '+b+' + '+a+' × '+c+' = ?',a*(b+c))}if(d===2){a=rnd(2,9);b=rnd(11,49);c=100-b;return q(type,a+' × '+b+' + '+a+' × '+c+' = ?',a*100)}if(d===3){a=rnd(20,80);b=rnd(2,9);c=rnd(2,9);return q(type,a+' × ('+b+' + '+c+') = ?',a*(b+c))}if(d===4){a=rnd(101,499);b=rnd(1,49);c=100-b;return q(type,a+' + '+b+' + '+c+' = ?',a+100)}if(d===5){a=rnd(11,49);b=rnd(2,8);c=rnd(2,8);return q(type,a+' × '+b+' − '+a+' × '+c+' = ?',a*(b-c))}if(d===6){a=rnd(20,99);b=rnd(2,9);return q(type,a+' × '+b+' + '+(100-a)+' × '+b+' = ?',100*b)}a=rnd(11,49);b=rnd(2,9);c=rnd(2,9);return q(type,'('+a+' + '+b+') × '+c+' = ?', (a+b)*c)}if(type==='fraction'){pairs=[['25%','0.25'],['50%','0.5'],['75%','0.75'],['10%','0.1'],['20%','0.2'],['1/2','0.5'],['1/4','0.25'],['3/4','0.75'],['1/5','0.2']];d=rnd(0,lv===1?2:lv===2?5:7);if(d===0){var p=pick(pairs.slice(0,5));return q(type,p[0]+' 写成小数是多少？',p[1])}if(d===1){p=pick(pairs.slice(5));return q(type,p[0]+' 写成小数是多少？',p[1])}if(d===2){p=pick([['0.25','25%'],['0.5','50%'],['0.75','75%'],['0.2','20%'],['0.1','10%']]);return q(type,p[0]+' 写成百分数是多少？',p[1])}if(d===3){p=pick([['1/2','50%'],['1/4','25%'],['3/4','75%'],['1/5','20%']]);return q(type,p[0]+' 写成百分数是多少？',p[1])}if(d===4){a=pick([20,40,60,80,100]);b=pick([10,25,50]);return q(type,a+' 的 '+b+'% 是多少？',a*b/100)}if(d===5){a=pick([20,40,60,80,100]);return q(type,a+' 的 1/2 是多少？',a/2)}if(d===6){a=pick([40,80,120,160]);return q(type,a+' 的 1/4 是多少？',a/4)}a=pick([20,40,60,80]);return q(type,a+' 的 25% 加上 '+a+' 的 50% 等于多少？',a*0.75)}return q('basic','1 + 1 = ?',2)}function fixWord(item){if(item.type==='word'&&item.answer==='0'){var m=item.text.match(/原有 (\d+) 本书，借走 (\d+) 本，又还回 (\d+) 本/);if(m)item.answer=String(Number(m[1])-Number(m[2])+Number(m[3]))}return item}function optionsFor(ans){var n=Number(ans),arr=[ans],x,p,qq,rr;if(isNaN(n)){if(ans.indexOf('余')>-1){p=ans.split('余');qq=Number(p[0]);rr=Number(p[1]);arr.push((qq+1)+'余'+rr);arr.push(Math.max(1,qq-1)+'余'+rr);arr.push(qq+'余'+(rr+1));return shuffle(arr)}if(ans.indexOf('%')>-1){n=Number(ans.replace('%',''));arr=[ans,Math.max(0,n-10)+'%',(n+10)+'%',Math.max(0,n-25)+'%'];return shuffle(arr)}arr.push(ans+'0','0'+ans,'1');return shuffle(arr)}while(arr.length<4){x=n+rnd(-Math.max(3,Math.round(Math.abs(n)*0.12)),Math.max(3,Math.round(Math.abs(n)*0.12)));if(x>=0&&arr.indexOf(String(x))<0)arr.push(String(x))}return shuffle(arr)}function saveWrong(item,user){var list=[];try{list=JSON.parse(localStorage.getItem(WRONG)||'[]')}catch(e){}if(!Array.isArray(list))list=[];list.unshift({type:item.type,text:item.text,answer:item.answer,user:String(user),time:Date.now()});try{localStorage.setItem(WRONG,JSON.stringify(list.slice(0,120)))}catch(e){}}function updateFill(){var t=Number($('total').value),c=Number($('choice').value);if(c>t){c=t;$('choice').value=String(c)}$('fillCount').textContent=(t-c)+' 题'}function start(){var t=Number($('total').value),c=Math.min(t,Number($('choice').value)),lv=Number($('level').value),i,forms=[],item;questions=[];for(i=0;i<t;i++)forms.push(i<c?'choice':'fill');shuffle(forms);for(i=0;i<t;i++){item=fixWord(make(selected,lv));item.form=forms[i];questions.push(item)}index=0;correct=0;$('setup').className='card hidden';$('result').className='card result hidden';$('quiz').className='card';render()}function render(){var item=questions[index],area=$('answerArea'),i,opts,b,input,submit,box;$('kind').textContent=labels[item.type]+' · '+$('level').options[$('level').selectedIndex].text+' · '+(item.form==='choice'?'选择题':'填空题');$('count').textContent='第 '+(index+1)+' / '+questions.length+' 题';$('bar').style.width=((index/questions.length)*100)+'%';$('question').textContent=item.text;$('question').className=item.type==='word'?'q word':'q';$('feedback').textContent='';area.innerHTML='';if(item.form==='choice'){box=document.createElement('div');box.className='options';opts=optionsFor(item.answer);for(i=0;i<opts.length;i++){b=document.createElement('button');b.className='opt';b.textContent=opts[i];b.setAttribute('data-v',opts[i]);b.onclick=function(){judge(this.getAttribute('data-v'))};box.appendChild(b)}area.appendChild(box)}else{box=document.createElement('div');box.className='fill';input=document.createElement('input');input.id='fillInput';input.setAttribute('inputmode','decimal');input.setAttribute('autocomplete','off');input.placeholder='输入答案';submit=document.createElement('button');submit.textContent='提交';submit.onclick=function(){judge(input.value)};input.onkeydown=function(e){e=e||window.event;if(e.keyCode===13)judge(input.value)};box.appendChild(input);box.appendChild(submit);area.appendChild(box);setTimeout(function(){try{input.focus()}catch(e){}},60)}}function normalize(v){return String(v).replace(/\s+/g,'').replace('％','%').replace('。','.')}function judge(v){var item=questions[index],ok=normalize(v)===normalize(item.answer);if(ok){correct++;$('feedback').className='feedback ok';$('feedback').textContent='✓ 正确'}else{$('feedback').className='feedback bad';$('feedback').textContent='正确答案：'+item.answer;saveWrong(item,v)}setTimeout(next,500)}function next(){index++;if(index>=questions.length)finish();else render()}function finish(){$('quiz').className='card hidden';$('result').className='card result';var pct=Math.round(correct/questions.length*100);$('score').textContent=pct+'%';$('scoreText').textContent='答对 '+correct+' / '+questions.length+' 题'}var types=document.querySelectorAll('.type'),i;for(i=0;i<types.length;i++){types[i].onclick=function(){var all=document.querySelectorAll('.type'),j;for(j=0;j<all.length;j++)all[j].className='type';this.className='type active';selected=this.getAttribute('data-type')}}$('total').onchange=updateFill;$('choice').onchange=updateFill;$('start').onclick=start;$('again').onclick=function(){$('result').className='card result hidden';$('setup').className='card'};updateFill()})();</script></body></html>
