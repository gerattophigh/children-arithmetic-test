<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>专项练习</title><style>:root{--bg:#f7fbf9;--card:#fff;--text:#243238;--muted:#6e7a80;--green:#178f7e;--green2:#0b6d61;--orange:#f97316;--line:#dce8e3;--red:#c2413b;--shadow:0 14px 34px rgba(43,74,64,.10)}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}.wrap{width:min(980px,calc(100% - 28px));margin:auto;padding:24px 0 48px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:18px}.back{color:var(--green2);font-weight:800;text-decoration:none}.card{background:#fff;border:1px solid var(--line);border-radius:26px;padding:clamp(20px,4vw,34px);box-shadow:var(--shadow)}h1{margin:0 0 6px;font-size:clamp(28px,5vw,40px)}.muted{color:var(--muted);line-height:1.7}.groups{display:grid;gap:16px;margin-top:22px}.group{border:1px solid var(--line);border-radius:22px;padding:18px}.group h2{margin:0 0 12px;font-size:21px}.types{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.type{border:1px solid var(--line);background:#f8fcfa;border-radius:16px;padding:14px;text-align:left;cursor:pointer;font-weight:800}.type small{display:block;color:var(--muted);font-weight:500;margin-top:5px}.type.active{border:2px solid var(--green);background:#edf9f5}.config{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:22px}.field{background:#f7faf8;border-radius:15px;padding:12px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field select{width:100%;border:0;background:transparent;font-weight:800}.start{width:100%;margin-top:14px;border:0;border-radius:16px;padding:15px;background:linear-gradient(135deg,var(--green),var(--green2));color:white;font-weight:900;cursor:pointer}.hidden{display:none!important}.progress{height:10px;background:#edf1ef;border-radius:99px;overflow:hidden;margin:14px 0 24px}.bar{height:100%;background:var(--green);width:0}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}.q{font-size:clamp(28px,6vw,48px);font-weight:900;text-align:center;line-height:1.45;margin:24px 0}.q.word{font-size:clamp(21px,4.5vw,34px)}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.opt{border:2px solid var(--line);border-radius:16px;background:#fff;padding:15px;font-size:20px;font-weight:850;cursor:pointer}.fill{display:flex;gap:10px}.fill input{flex:1;min-width:0;border:2px solid var(--line);border-radius:16px;padding:15px;font-size:22px;text-align:center}.fill button{border:0;border-radius:16px;padding:0 22px;background:var(--green);color:#fff;font-weight:900}.feedback{text-align:center;min-height:28px;margin-top:13px;font-weight:800}.ok{color:var(--green2)}.bad{color:var(--red)}.result{text-align:center}.result strong{font-size:54px;color:var(--green)}.again{display:flex;gap:10px;justify-content:center;margin-top:20px}.again a,.again button{border:0;border-radius:14px;padding:13px 18px;font-weight:850;text-decoration:none;cursor:pointer}.again button{background:var(--green);color:white}.again a{background:#eef3f1;color:var(--text)}@media(max-width:720px){.types{grid-template-columns:1fr}.config{grid-template-columns:1fr}.options{grid-template-columns:1fr}.top{align-items:flex-start}}</style></head><body><main class="wrap"><div class="top"><div><h1>专项练习</h1><div class="muted">先练一个点，练熟再换。</div></div><a class="back" href="./index.html">← 首页</a></div><section id="setup" class="card"><div class="groups"><div class="group"><h2>一、加减法</h2><div class="types"><button class="type active" data-type="basic"><b>基础加减法</b><small>20 / 100以内，不出现负数</small></button><button class="type" data-type="multiAddSub"><b>多位加减法</b><small>2～4位数进位、借位</small></button><button class="type" data-type="chain"><b>连加连减</b><small>三步以内，过程保持非负</small></button></div></div><div class="group"><h2>二、乘除法</h2><div class="types"><button class="type" data-type="oneMulti"><b>个位乘多位</b><small>2～9 × 两/三位数</small></button><button class="type" data-type="multiMulti"><b>多位乘多位</b><small>两位数 × 两位数</small></button><button class="type" data-type="remainder"><b>除法余数</b><small>除数和商控制在九九范围</small></button><button class="type" data-type="longDiv"><b>多位除法</b><small>多位数 ÷ 一位数，整除为主</small></button></div></div><div class="group"><h2>三、应用题</h2><div class="types"><button class="type" data-type="word"><b>混合加减乘除应用题</b><small>一步或两步生活情境题</small></button></div></div><div class="group"><h2>四、数学技巧</h2><div class="types"><button class="type" data-type="laws"><b>运算律</b><small>交换律、结合律、分配律</small></button><button class="type" data-type="fraction"><b>小数、分数、百分数</b><small>先从基础等值转换开始</small></button></div></div></div><div class="config"><div class="field"><label>总题数</label><select id="total"><option>10</option><option selected>20</option><option>30</option><option>40</option></select></div><div class="field"><label>选择题数量</label><select id="choice"><option>0</option><option>5</option><option selected>10</option><option>15</option><option>20</option><option>30</option></select></div><div class="field"><label>填空题数量</label><div id="fillCount" style="font-weight:900;padding-top:3px">10 题</div></div></div><button id="start" class="start">开始专项练习</button></section><section id="quiz" class="card hidden"><div class="meta"><span id="kind"></span><span id="count"></span></div><div class="progress"><div id="bar" class="bar"></div></div><div id="question" class="q"></div><div id="answerArea"></div><div id="feedback" class="feedback"></div></section><section id="result" class="card result hidden"><h2>专项练习完成</h2><p class="muted">这一轮先看准确率，错题已经进入错题回顾。</p><strong id="score">0%</strong><p id="scoreText"></p><div class="again"><button id="again">再练一组</button><a href="./index.html">返回首页</a></div></section></main><script>(function(){'use strict';var WRONG='mathLearningWrongV3';var selected='basic';var questions=[],index=0,correct=0;function $(id){return document.getElementById(id)}function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}function shuffle(a){var i,j,t;for(i=a.length-1;i>0;i--){j=rnd(0,i);t=a[i];a[i]=a[j];a[j]=t}return a}function question(type,text,answer){return{type:type,text:text,answer:String(answer)}}function make(type){var a,b,c,d,q,r,total,part,price,boxes,each;switch(type){case'basic':if(rnd(0,1)){a=rnd(2,99);b=rnd(1,99);return question(type,a+' + '+b+' = ?',a+b)}a=rnd(5,100);b=rnd(1,a);return question(type,a+' − '+b+' = ?',a-b);case'multiAddSub':if(rnd(0,1)){a=rnd(100,9999);b=rnd(100,9999);return question(type,a+' + '+b+' = ?',a+b)}a=rnd(200,9999);b=rnd(100,a);return question(type,a+' − '+b+' = ?',a-b);case'chain':a=rnd(20,80);b=rnd(2,20);c=rnd(2,20);if(rnd(0,1))return question(type,a+' + '+b+' − '+c+' = ?',a+b-c);c=Math.min(c,a+b);return question(type,a+' − '+Math.min(b,a)+' + '+c+' = ?',a-Math.min(b,a)+c);case'oneMulti':a=rnd(2,9);b=rnd(10,999);return question(type,a+' × '+b+' = ?',a*b);case'multiMulti':a=rnd(10,99);b=rnd(10,99);return question(type,a+' × '+b+' = ?',a*b);case'remainder':b=rnd(2,9);q=rnd(2,9);r=rnd(1,b-1);a=b*q+r;return question(type,a+' ÷ '+b+' = ?（写成“商余余数”，如 7余4）',q+'余'+r);case'longDiv':b=rnd(2,9);q=rnd(10,99);a=b*q;return question(type,a+' ÷ '+b+' = ?',q);case'word':if(rnd(0,2)===0){boxes=rnd(2,7);each=rnd(3,9);part=rnd(1,boxes*each-1);return question(type,'有 '+boxes+' 盒铅笔，每盒 '+each+' 支，送给同学 '+part+' 支，还剩多少支？',boxes*each-part)}if(rnd(0,1)){price=rnd(3,12);total=rnd(2,8);return question(type,'一本练习册 '+price+' 元，买 '+total+' 本，一共多少元？',price*total)}a=rnd(20,80);b=rnd(5,a);c=rnd(2,20);return question(type,'小明有 '+a+' 张卡片，送出 '+b+' 张，又得到 '+c+' 张，现在有多少张？',a-b+c);case'laws':a=rnd(11,39);b=rnd(2,9);c=rnd(2,9);if(rnd(0,1))return question(type,a+' × '+b+' + '+a+' × '+c+' = ?',a*(b+c));return question(type,a+' + '+b+' + '+c+' = ?（可以先凑整）',a+b+c);case'fraction':d=rnd(0,2);if(d===0){a=[25,50,75][rnd(0,2)];return question(type,a+'% 写成小数是多少？',(a/100).toString())}if(d===1){a=[2,4,5,10][rnd(0,3)];return question(type,'1/'+a+' 写成小数是多少？',(1/a).toString())}a=[0.1,0.2,0.5,0.75][rnd(0,3)];return question(type,a+' 写成百分数是多少？',Math.round(a*100)+'%')}}return question('basic','1 + 1 = ?',2)}function optionsFor(ans){var n=Number(ans),arr=[ans],x;if(isNaN(n)){if(ans.indexOf('余')>-1){var p=ans.split('余'),qq=Number(p[0]),rr=Number(p[1]);arr.push((qq+1)+'余'+rr);arr.push(Math.max(1,qq-1)+'余'+rr);arr.push(qq+'余'+Math.max(1,rr-1));return shuffle(arr)}arr.push(ans+'0','0'+ans,'1');return shuffle(arr)}while(arr.length<4){x=n+rnd(-10,10);if(x>=0&&arr.indexOf(String(x))<0)arr.push(String(x))}return shuffle(arr)}function saveWrong(q,user){var list=[];try{list=JSON.parse(localStorage.getItem(WRONG)||'[]')}catch(e){}if(!Array.isArray(list))list=[];list.unshift({type:q.type,text:q.text,answer:q.answer,user:String(user),time:Date.now()});try{localStorage.setItem(WRONG,JSON.stringify(list.slice(0,120)))}catch(e){}}function updateFill(){var t=Number($('total').value),c=Number($('choice').value);if(c>t){c=t;$('choice').value=String(c)}$('fillCount').textContent=(t-c)+' 题'}function start(){var t=Number($('total').value),c=Math.min(t,Number($('choice').value)),i,forms=[];questions=[];for(i=0;i<t;i++){forms.push(i<c?'choice':'fill')}shuffle(forms);for(i=0;i<t;i++){var q=make(selected);q.form=forms[i];questions.push(q)}index=0;correct=0;$('setup').className='card hidden';$('result').className='card result hidden';$('quiz').className='card';render()}function render(){var q=questions[index],area=$('answerArea'),i,opts,b,input,submit;$('kind').textContent=document.querySelector('.type.active b').textContent+' · '+(q.form==='choice'?'选择题':'填空题');$('count').textContent='第 '+(index+1)+' / '+questions.length+' 题';$('bar').style.width=((index/questions.length)*100)+'%';$('question').textContent=q.text;$('question').className=q.type==='word'?'q word':'q';$('feedback').textContent='';area.innerHTML='';if(q.form==='choice'){var box=document.createElement('div');box.className='options';opts=optionsFor(q.answer);for(i=0;i<opts.length;i++){b=document.createElement('button');b.className='opt';b.textContent=opts[i];b.setAttribute('data-v',opts[i]);b.onclick=function(){judge(this.getAttribute('data-v'))};box.appendChild(b)}area.appendChild(box)}else{var f=document.createElement('div');f.className='fill';input=document.createElement('input');input.id='fillInput';input.inputMode='decimal';input.autocomplete='off';input.placeholder='输入答案';submit=document.createElement('button');submit.textContent='提交';submit.onclick=function(){judge(input.value)};input.onkeydown=function(e){if((e||window.event).keyCode===13)judge(input.value)};f.appendChild(input);f.appendChild(submit);area.appendChild(f);setTimeout(function(){input.focus()},50)}}function normalize(v){return String(v).replace(/\s+/g,'').replace('％','%')}function judge(v){var q=questions[index],ok=normalize(v)===normalize(q.answer);if(ok){correct++;$('feedback').className='feedback ok';$('feedback').textContent='✓ 正确'}else{$('feedback').className='feedback bad';$('feedback').textContent='正确答案：'+q.answer;saveWrong(q,v)}setTimeout(next,450)}function next(){index++;if(index>=questions.length){finish()}else render()}function finish(){$('quiz').className='card hidden';$('result').className='card result';var pct=Math.round(correct/questions.length*100);$('score').textContent=pct+'%';$('scoreText').textContent='答对 '+correct+' / '+questions.length+' 题'}var types=document.querySelectorAll('.type'),i;for(i=0;i<types.length;i++){types[i].onclick=function(){var all=document.querySelectorAll('.type'),j;for(j=0;j<all.length;j++)all[j].className='type';this.className='type active';selected=this.getAttribute('data-type')}}$('total').onchange=updateFill;$('choice').onchange=updateFill;$('start').onclick=start;$('again').onclick=function(){$('result').className='card result hidden';$('setup').className='card'};updateFill()})();</script></body></html>
